<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打印凭证</title>
  <link rel="stylesheet" href="/css/print.css">
</head>
<body>
  <div class="header">
    <div class="header-left">
      <img id="headerLogo" class="header-logo" src="/images/logo.png" alt="logo">
      <h1 id="schoolName">访客凭证</h1>
    </div>
    <a href="/index.html">← 返回登记页</a>
  </div>
  
  <div class="toolbar">
    <select id="statusFilter" onchange="loadData()">
      <option value="all">全部状态</option>
      <option value="current">在访中</option>
      <option value="checked">已签离</option>
    </select>
    <select id="typeFilter" onchange="loadData()">
      <option value="">全部身份</option>
      <option value="家长">学生家长</option>
      <option value="维修工">维修工人</option>
      <option value="外来老师">外来老师</option>
    </select>
  </div>
  
  <div class="list" id="badgeList">
    <div class="empty">加载中...</div>
  </div>
  
  <div class="actions">
    <button class="btn-select" onclick="selectAll()">全选</button>
    <button class="btn-print" onclick="printSelected()">打印选中</button>
  </div>

  <script>
    var allData = [];
    var selectedIds = new Set();
    
    function textColorFor(hex) {
      var h = (hex || '').replace('#', '');
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      if (h.length !== 6) return '#ffffff';
      var r = parseInt(h.substr(0, 2), 16);
      var g = parseInt(h.substr(2, 2), 16);
      var b = parseInt(h.substr(4, 2), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#111827' : '#ffffff';
    }

    async function applyConfig() {
      try {
        var res = await fetch('/api/config');
        var cfg = await res.json();
        var s = document.documentElement.style;
        s.setProperty('--primary', cfg.theme.primary);
        s.setProperty('--secondary', cfg.theme.secondary);
        s.setProperty('--on-primary', textColorFor(cfg.theme.primary));
        document.getElementById('schoolName').textContent = cfg.schoolName || '访客凭证';
        if (cfg.logoPath) document.getElementById('headerLogo').src = cfg.logoPath;
      } catch(e) {}
    }
    
    async function loadData() {
      var status = document.getElementById('statusFilter').value;
      var type = document.getElementById('typeFilter').value;
      
      var url = '/api/visitors?page=1&pageSize=200';
      var res = await fetch(url);
      var data = await res.json();
      allData = data.data || [];
      
      if (status === 'current') {
        allData = allData.filter(function(v) { return !v.checkout_at; });
      } else if (status === 'checked') {
        allData = allData.filter(function(v) { return !!v.checkout_at; });
      }
      
      if (type) {
        allData = allData.filter(function(v) { return v.identity === type; });
      }
      
      render();
    }
    
    function render() {
      var grid = document.getElementById('badgeList');
      
      if (allData.length === 0) {
        grid.innerHTML = '<div class="empty">暂无记录</div>';
        return;
      }
      
      var html = '';
      for (var i = 0; i < allData.length; i++) {
        var v = allData[i];
        
        html += '<div class="badge-card">';
        html += '<input type="checkbox" ' + (selectedIds.has(v.id) ? 'checked' : '') + ' onchange="toggleSelect(' + v.id + ')">';
        html += '<div class="badge-header">';
        html += '<div class="badge-name">' + v.name + '</div>';
        html += '<div class="badge-code">' + (v.code || '-') + '</div>';
        html += '<span class="badge-type">' + (v.identity || '访客') + '</span>';
        html += '</div></div>';
      }
      
      grid.innerHTML = html;
    }
    
    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
    }
    
    function selectAll() {
      if (selectedIds.size === allData.length) {
        selectedIds.clear();
      } else {
        selectedIds.clear();
        for (var i = 0; i < allData.length; i++) {
          selectedIds.add(allData[i].id);
        }
      }
      render();
    }
    
    function printSelected() {
      if (selectedIds.size === 0) {
        selectAll();
        setTimeout(function() { window.print(); }, 100);
      } else {
        window.print();
      }
    }
    
    applyConfig();
    loadData();
  </script>
</body>
</html>

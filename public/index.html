<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客登记</title>
  <link rel="stylesheet" href="/css/index.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <img id="schoolLogo" class="school-logo" alt="校徽" style="display:none;">
        <div class="header-title">
          <h1 id="schoolName">访客登记</h1>
          <p id="welcomeText">Visitor Registration</p>
        </div>
        <button id="authBtn" class="auth-btn" onclick="openAuth()">登录</button>
      </div>
      <div id="userBar" class="user-bar" style="display:none;"></div>
    </div>

    <div class="form">
      <div id="message" class="message"></div>
      <div id="guestHint" class="guest-hint" style="display:none;"></div>

      <form id="form"></form>

      <div class="links">
        <a href="/records.html">查看记录</a>
        <a href="/lookup">查询访客码</a>
      </div>
      <div id="contact" class="contact"></div>
    </div>
  </div>

  <!-- 登录/注册弹窗 -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="authTitle">登录</h2>
        <button class="modal-close" onclick="closeAuth()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="authLogin">
          <input type="text" id="loginUser" placeholder="账号">
          <input type="password" id="loginPass" placeholder="密码">
          <button class="btn-submit" onclick="doLogin()">登录</button>
          <p class="auth-switch">还没有账号？<a onclick="showRegister()">去注册</a></p>
        </div>
        <div id="authRegister" style="display:none;">
          <div class="reg-role-label">选择身份</div>
          <div class="reg-role-grid">
            <input type="radio" name="regRole" value="parent" id="regRole_parent" checked onchange="onRegRoleChange()">
            <label for="regRole_parent">访客</label>
            <input type="radio" name="regRole" value="teacher" id="regRole_teacher" onchange="onRegRoleChange()">
            <label for="regRole_teacher">老师</label>
            <input type="radio" name="regRole" value="principal" id="regRole_principal" onchange="onRegRoleChange()">
            <label for="regRole_principal">校长</label>
          </div>
          <div class="reg-name-wrap">
            <input type="text" id="regName" placeholder="姓名（即登录账号）" oninput="onRegNameInput()">
            <span id="regNameStatus" class="reg-name-status"></span>
          </div>
          <div class="reg-pwd-wrap">
            <input type="password" id="regPass" placeholder="设置密码">
            <button type="button" class="pwd-toggle" onclick="togglePwd('regPass', this)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="reg-pwd-wrap">
            <input type="password" id="regPass2" placeholder="确认密码">
            <button type="button" class="pwd-toggle" onclick="togglePwd('regPass2', this)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div id="regParentFields">
            <input type="tel" id="regPhone" placeholder="手机号" maxlength="11">
          </div>
          <div id="regTeacherFields" style="display:none;">
            <select id="regGrade" onchange="fillRegClass()">
              <option value="">选择年级</option>
            </select>
            <select id="regClass"><option value="">选择班级</option></select>
          </div>
          <button class="btn-submit" onclick="doRegister()">注册</button>
          <p class="auth-switch">已有账号？<a onclick="showLogin()">去登录</a></p>
        </div>
        <p id="authError" class="auth-error"></p>
      </div>
    </div>
  </div>

  <!-- 我的资料弹窗 -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal">
      <div class="modal-header">
        <h2>我的资料</h2>
        <button class="modal-close" onclick="closeProfile()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="profileName" placeholder="姓名">
        <div id="profileParentFields">
          <input type="tel" id="profilePhone" placeholder="手机号" maxlength="11">
          <div class="profile-photo-upload" onclick="document.getElementById('profilePhotoInput').click()">点击上传照片</div>
          <input type="file" id="profilePhotoInput" accept="image/*" style="display:none;" onchange="uploadProfilePhoto(this)">
          <img id="profilePhotoPreview" class="photo-preview" alt="照片预览">
        </div>
        <div id="profileTeacherFields" style="display:none;">
          <select id="profileGrade" onchange="fillProfileClass()">
            <option value="">选择年级</option>
          </select>
          <select id="profileClass"><option value="">选择班级</option></select>
        </div>
        <button class="btn-submit" onclick="saveProfile()">保存</button>
      </div>
    </div>
  </div>

  <script>
    var config = null;
    var currentUser = null;
    var teachers = [];
    var currentIdentity = '';
    var photoPath = null;
    var schoolClasses = { grades: [], classesPerGrade: 4 };

    function el(id) { return document.getElementById(id); }

    function roleLabel(r) { return r === 'parent' ? '访客' : r === 'teacher' ? '老师' : r === 'principal' ? '校长' : '员工'; }

    function fieldCfg(key) { return (config.fields || []).find(function(f) { return f.key === key; }); }
    function fieldEnabled(key) { var f = fieldCfg(key); return !f || f.enabled !== false; }
    function fieldRequired(key) { var f = fieldCfg(key); return !!f && f.required !== false; }

    async function init() {
      config = await (await fetch('/api/config')).json();
      try {
        var r = await fetch('/api/auth/me');
        currentUser = r.ok ? await r.json() : null;
      } catch(e) { currentUser = null; }
      teachers = await (await fetch('/api/teachers')).json();
      try {
        schoolClasses = await (await fetch('/api/school-classes')).json();
      } catch(e) { schoolClasses = { grades: [], classesPerGrade: 4 }; }
      fillGradeSelects();
      applyTheme();
      applyHeader();
      applyAuthBar();
      var ids = (config.identityTypes || []).filter(function(t) { return t.enabled; });
      if (ids.length === 0) ids = config.identityTypes || [];
      currentIdentity = ids.length ? ids[0].value : '';
      renderForm();
    }

    function fillGradeSelects() {
      var opts = '<option value="">选择年级</option>';
      (schoolClasses.grades || []).forEach(function(g) {
        opts += '<option value="' + g + '">' + g + '</option>';
      });
      el('regGrade').innerHTML = opts;
      el('profileGrade').innerHTML = opts;
    }

    function textColorFor(hex) {
      var h = (hex || '').replace('#', '');
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      if (h.length !== 6) return '#ffffff';
      var r = parseInt(h.substr(0, 2), 16);
      var g = parseInt(h.substr(2, 2), 16);
      var b = parseInt(h.substr(4, 2), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#111827' : '#ffffff';
    }

    function applyTheme() {
      var s = document.documentElement.style;
      s.setProperty('--primary', config.theme.primary);
      s.setProperty('--secondary', config.theme.secondary);
      s.setProperty('--on-primary', textColorFor(config.theme.primary));
    }

    function applyHeader() {
      el('schoolName').textContent = config.schoolName || '访客登记';
      el('welcomeText').textContent = config.welcomeText || '';
      var logo = el('schoolLogo');
      if (config.logoPath) { logo.src = config.logoPath; logo.style.display = 'block'; }
      else { logo.style.display = 'none'; }
      el('contact').textContent = config.contactPhone ? '联系电话：' + config.contactPhone : '';
    }

    function applyAuthBar() {
      el('authBtn').style.display = currentUser ? 'none' : 'inline-block';
      var bar = el('userBar');
      if (!currentUser) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
      bar.style.display = 'flex';
      var avatar = currentUser.photo_path ? '<img class="ub-avatar" src="' + currentUser.photo_path + '">' : '';
      bar.innerHTML = avatar +
        '<div class="ub-text">你好，' + (currentUser.name || currentUser.username) + '（' + roleLabel(currentUser.role) + '）</div>' +
        '<button class="ub-btn" onclick="openProfile()">我的资料</button>' +
        '<button class="ub-btn" onclick="logout()">退出</button>';
    }

    function renderForm() {
      var h = '';
      if (isParent()) {
        h += buildParentProfileCard();
        h += buildIdentityGridHtml();
        h += '<div id="identitySection">' + buildParentSection() + '</div>';
        h += buildCustomFieldsHtml();
      } else {
        h += buildGuestHint();
        h += buildStaticHtml();
        h += '<div id="identitySection">' + buildIdentitySection() + '</div>';
        h += buildCustomFieldsHtml();
      }
      h += '<button type="submit" class="btn-submit" id="submitBtn">提交登记</button>';
      el('form').innerHTML = h;
      onPurposeChange();
    }

    function isParent() { return currentUser && currentUser.role === 'parent'; }

    function buildGuestHint() {
      return '<div class="guest-hint">访客登录后可免填写姓名、手机号、照片，只需选择被访人和填写事由。' +
        '<a onclick="openAuth()">立即登录/注册</a></div>';
    }

    function buildParentProfileCard() {
      var avatar = currentUser.photo_path ? '<img class="ub-avatar" style="width:56px;height:56px;" src="' + currentUser.photo_path + '">' : '';
      return '<div class="guest-hint" style="display:flex;align-items:center;gap:12px;background:color-mix(in srgb, var(--primary) 10%, white);">' +
        avatar +
        '<div style="flex:1;font-size:14px;"><div style="font-weight:600;">' + (currentUser.name || '') + '</div>' +
        '<div style="color:#6b7280;font-size:12px;margin-top:2px;">' + (currentUser.phone || '未填写手机号') + '</div></div>' +
        '<button class="ub-btn" style="background:var(--primary);border:none;color:var(--on-primary);" onclick="openProfile()">编辑</button></div>';
    }

    function buildIdentityGridHtml() {
      var ids = (config.identityTypes || []).filter(function(t) { return t.enabled; });
      if (ids.length === 0) ids = config.identityTypes || [];
      var h = '<div class="form-group"><div class="identity-grid">';
      ids.forEach(function(t, i) {
        h += '<input type="radio" name="identity" value="' + t.value + '" id="identity_' + i + '"' + (t.value === currentIdentity ? ' checked' : '') + ' onchange="onIdentityChange(this)">';
        h += '<label for="identity_' + i + '">' + t.label + '</label>';
      });
      h += '</div></div>';
      return h;
    }

    function buildStaticHtml() {
      var h = '';
      h += buildIdentityGridHtml();

      if (fieldEnabled('name') || fieldEnabled('phone')) {
        h += '<div class="form-row">';
        if (fieldEnabled('name')) {
          var nc = fieldCfg('name');
          h += '<div class="form-group form-col-40"><label>' + (nc && nc.label ? nc.label : '姓名');
          if (fieldRequired('name')) h += ' <span class="required">*</span>';
          h += '</label><input type="text" name="name" placeholder="姓名" oninput="onNameInput(this.value)"></div>';
        }
        if (fieldEnabled('phone')) {
          var pc = fieldCfg('phone');
          h += '<div class="form-group form-col-60"><label>' + (pc && pc.label ? pc.label : '手机号');
          if (fieldRequired('phone')) h += ' <span class="required">*</span>';
          h += '</label><input type="tel" name="phone" maxlength="11" placeholder="手机号"></div>';
        }
        h += '</div>';
      }
      return h;
    }

    function buildCustomFieldsHtml() {
      var h = '';
      (config.customFields || []).forEach(function(cf) {
        h += '<div class="form-group"><label>' + cf.label + (cf.required ? ' <span class="required">*</span>' : '') + '</label>';
        h += '<input type="text" name="custom_' + cf.id + '" placeholder="请输入' + cf.label + '"></div>';
      });
      return h;
    }

    function buildIdentitySection() {
      if (currentIdentity === '家长') return buildParentSection();
      if (currentIdentity === '维修工') return buildWorkerSection();
      if (currentIdentity === '外来老师') return buildTeacherSection();
      if (currentIdentity === '其他') return buildOtherSection();
      return buildGenericSection();
    }

    function buildGenericSection() {
      var purposes = (config.purposes && config.purposes[currentIdentity]) || [];
      var h = '<div class="section-title">' + currentIdentity + '信息</div>';
      if (purposes.length) h += buildPurposeRadios(purposes);
      h += '<div class="form-group"><label>具体事项</label><input type="text" name="purposeDetail" placeholder="请填写具体事项"></div>';
      return h;
    }

    function teacherOptions() {
      var h = '<option value="">请选择被访老师</option>';
      teachers.forEach(function(t) {
        var label = t.name + (t.class_name ? '（' + t.class_name + '）' : '');
        h += '<option value="' + t.name + '">' + label + '</option>';
      });
      return h;
    }

    function gradeOptions() {
      var h = '';
      (schoolClasses.grades || []).forEach(function(g) {
        h += '<option value="' + g + '">' + g + '</option>';
      });
      return h;
    }

    function selectParentGrade(grade, btn) {
      var grid = el('parentGradeGrid');
      grid.querySelectorAll('.class-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      el('parentGrade').value = grade;
      el('parentClass').value = '';
      var classGrid = el('parentClassGrid');
      var n = schoolClasses.classesPerGrade || 4;
      var html = '';
      for (var i = 1; i <= n; i++) {
        var cls = grade + '（' + i + '）班';
        html += '<div class="class-btn" onclick="selectParentClass(\'' + cls + '\', this)">' + i + '班</div>';
      }
      classGrid.innerHTML = html;
    }

    function selectParentClass(cls, btn) {
      var grid = el('parentClassGrid');
      grid.querySelectorAll('.class-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      el('parentClass').value = cls;
    }

    function buildParentSection() {
      var purposes = (config.purposes && config.purposes['家长']) || [];
      var h = '<div class="section-title">来访信息</div>';
      if (purposes.length) h += buildPurposeRadios(purposes);
      h += '<div id="classFields" class="form-group" style="display:none;">';
      h += '<label>选择班级 <span class="required">*</span></label>';
      h += '<div class="class-selector">';
      h += '<div class="class-grid" id="parentGradeGrid">';
      (schoolClasses.grades || []).forEach(function(g, i) {
        h += '<div class="class-btn' + (i === 0 ? '' : '') + '" onclick="selectParentGrade(\'' + g + '\', this)">' + g + '</div>';
      });
      h += '</div>';
      h += '<div class="class-grid" id="parentClassGrid"></div>';
      h += '<input type="hidden" name="grade" id="parentGrade">';
      h += '<input type="hidden" name="classInfo" id="parentClass">';
      h += '</div></div>';
      h += '<div id="purposeDetailParent" class="form-group" style="display:none;"><label>具体事项</label><input type="text" name="purposeDetail" placeholder="请填写具体事项（选填）"></div>';
      return h;
    }

    function buildPurposeRadios(purposes) {
      var h = '<div class="form-group"><label>来校事由 <span class="required">*</span></label><div class="purpose-grid">';
      purposes.forEach(function(p, i) {
        h += '<input type="radio" name="purpose" value="' + p + '" id="purpose_' + i + '"' + (i === 0 ? ' checked' : '') + ' onchange="onPurposeChange()">';
        h += '<label for="purpose_' + i + '">' + p + '</label>';
      });
      h += '</div></div>';
      return h;
    }

    function buildWorkerSection() {
      var h = '<div class="section-title">维修工人信息</div>';
      h += '<div class="form-group"><label>公司名称 <span class="required">*</span></label><input type="text" name="company" placeholder="请输入公司名称"></div>';
      h += '<div class="form-group"><label>来修什么 <span class="required">*</span></label><input type="text" name="reason" placeholder="请填写维修内容"></div>';
      return h;
    }

    function buildTeacherSection() {
      var purposes = (config.purposes && config.purposes['外来老师']) || [];
      var h = '<div class="section-title">来访人信息</div>';
      h += '<div class="form-row">';
      h += '<div class="form-group form-col-50"><label>来访人单位 <span class="required">*</span></label><input type="text" name="fromSchool" placeholder="请输入单位名称"></div>';
      if (purposes.length) {
        h += '<div class="form-group form-col-50"><label>来校事由 <span class="required">*</span></label><div class="purpose-grid">';
        purposes.forEach(function(p, i) {
          h += '<input type="radio" name="purpose" value="' + p + '" id="purpose_' + i + '"' + (i === 0 ? ' checked' : '') + ' onchange="onPurposeChange()">';
          h += '<label for="purpose_' + i + '">' + p + '</label>';
        });
        h += '</div></div>';
      }
      h += '</div>';
      h += '<div id="teacherDetail" class="form-group"><label id="teacherDetailLabel">具体事项</label><input type="text" name="purposeDetail" placeholder="请填写具体事项（选填）"></div>';
      return h;
    }

    function buildOtherSection() {
      var h = '<div class="section-title">其他人员信息</div>';
      h += '<div class="form-group"><label>来校事由 <span class="required">*</span></label><input type="text" name="purposeDetail" placeholder="请输入来校事由"></div>';
      return h;
    }

    function onIdentityChange(input) {
      currentIdentity = input.value;
      el('identitySection').innerHTML = buildIdentitySection();
      onPurposeChange();
    }

    function onPurposeChange() {
      var checked = document.querySelector('input[name="purpose"]:checked');
      var purpose = checked ? checked.value : '';
      if (currentIdentity === '家长') {
        var cf = el('classFields'), pd = el('purposeDetailParent');
        var showClass = (purpose === '接送' || purpose === '沟通' || purpose === '家长会' || purpose === '陪餐');
        if (cf) cf.style.display = showClass ? 'block' : 'none';
        if (pd) pd.style.display = purpose === '其他' ? 'block' : 'none';
      } else if (currentIdentity === '外来老师') {
        var labels = { '督导检查': '检查内容', '观摩交流': '交流内容', '其他': '具体事项' };
        var l = el('teacherDetailLabel');
        if (l) l.innerHTML = (labels[purpose] || '具体事项');
      }
    }

    // 输入姓名时自动填充手机号（老访客）
    var _nameSearchTimer = null;
    var _lastAutoFillName = '';
    function onNameInput(val) {
      clearTimeout(_nameSearchTimer);
      var phoneInput = document.querySelector('input[name="phone"]');
      if (_lastAutoFillName && val !== _lastAutoFillName && phoneInput) {
        phoneInput.readOnly = false;
        phoneInput.value = '';
        photoPath = null;
      }
      if (!val || val.length < 2) return;
      _nameSearchTimer = setTimeout(function() {
        fetch('/api/visitors/search-by-name?name=' + encodeURIComponent(val))
          .then(function(r) { return r.json(); })
          .then(function(v) {
            if (!v) return;
            _lastAutoFillName = val;
            if (phoneInput && v.phone) { phoneInput.value = v.phone; phoneInput.readOnly = true; }
            if (v.photo_path) photoPath = v.photo_path;
          })
          .catch(function() {});
      }, 300);
    }

    function handlePhoto(input) {
      var file = input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        var preview = el('photoPreview');
        preview.src = e.target.result;
        preview.classList.add('show');
        document.querySelector('.photo-upload').style.display = 'none';
        var fs = el('faceStatus');
        fs.textContent = '检测中...';
        fs.className = 'face-status detecting';
        setTimeout(function() {
          fs.textContent = '已检测到人脸';
          fs.className = 'face-status success';
        }, 300 + Math.random() * 800);
      };
      reader.readAsDataURL(file);
    }

    function showMessage(text, type) {
      var m = el('message');
      m.textContent = text;
      m.className = 'message ' + type;
      m.style.display = 'block';
    }

    // ===== 登录 / 注册 =====
    function openAuth() { el('authModal').classList.add('show'); showLogin(); }
    function closeAuth() { el('authModal').classList.remove('show'); }
    function showLogin() {
      el('authTitle').textContent = '登录';
      el('authLogin').style.display = 'block';
      el('authRegister').style.display = 'none';
      el('authError').textContent = '';
    }
    function showRegister() {
      el('authTitle').textContent = '注册';
      el('authLogin').style.display = 'none';
      el('authRegister').style.display = 'block';
      el('authError').textContent = '';
      el('regName').value = '';
      el('regPass').value = '';
      el('regPass2').value = '';
      el('regPhone').value = '';
      el('regNameStatus').textContent = '';
      el('regNameStatus').className = 'reg-name-status';
      el('regName').className = '';
      _regNameLastOk = '';
      var wrap = el('authRegister');
      if (currentUser) {
        wrap.classList.add('reg-locked');
        el('regName').value = currentUser.name || '';
        el('regName').disabled = true;
        el('regPhone').value = currentUser.phone || '';
        el('regPhone').disabled = true;
        _regNameLastOk = currentUser.name || '';
        var lbl = wrap.querySelector('.reg-locked-label');
        if (!lbl) { lbl = document.createElement('div'); lbl.className = 'reg-locked-label'; lbl.textContent = '姓名和手机号沿用当前登录信息'; el('regName').parentNode.insertBefore(lbl, el('regName').nextSibling); }
        var roleVal = currentUser.role === 'parent' ? 'parent' : currentUser.role === 'teacher' ? 'teacher' : 'principal';
        var radio = el('regRole_' + roleVal);
        if (radio) radio.checked = true;
        onRegRoleChange();
      } else {
        wrap.classList.remove('reg-locked');
        el('regName').disabled = false;
        el('regPhone').disabled = false;
        var oldLbl = wrap.querySelector('.reg-locked-label');
        if (oldLbl) oldLbl.remove();
        el('regRole_parent').checked = true;
        onRegRoleChange();
      }
    }
    function getRegRole() {
      var checked = document.querySelector('input[name="regRole"]:checked');
      return checked ? checked.value : 'parent';
    }
    function onRegRoleChange() {
      var role = getRegRole();
      el('regParentFields').style.display = role === 'parent' ? 'block' : 'none';
      el('regTeacherFields').style.display = role === 'teacher' ? 'block' : 'none';
    }
    function fillRegClass() {
      var g = el('regGrade').value;
      var sel = el('regClass');
      sel.innerHTML = '<option value="">选择班级</option>';
      if (!g) return;
      var n = schoolClasses.classesPerGrade || 4;
      for (var i = 1; i <= n; i++) sel.innerHTML += '<option value="' + g + '（' + i + '）班">' + g + '（' + i + '）班</option>';
    }

    function togglePwd(inputId, btn) {
      var inp = el(inputId);
      if (inp.type === 'password') { inp.type = 'text'; btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'; }
      else { inp.type = 'password'; btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'; }
    }

    var _regNameTimer = null;
    var _regNameLastOk = '';
    function onRegNameInput() {
      clearTimeout(_regNameTimer);
      var val = el('regName').value.trim();
      var st = el('regNameStatus');
      st.textContent = ''; st.className = 'reg-name-status';
      el('regName').className = '';
      if (!val) return;
      _regNameTimer = setTimeout(function() {
        fetch('/api/auth/check-username?username=' + encodeURIComponent(val))
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d.exists) { st.textContent = '已存在'; st.className = 'reg-name-status dup'; el('regName').className = 'input-dup'; _regNameLastOk = ''; }
            else { st.textContent = '可用'; st.className = 'reg-name-status ok'; el('regName').className = 'input-ok'; _regNameLastOk = val; }
          })
          .catch(function() {});
      }, 400);
    }

    async function doLogin() {
      var u = el('loginUser').value.trim();
      var p = el('loginPass').value;
      if (!u || !p) { el('authError').textContent = '请输入账号和密码'; return; }
      var res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      var data = await res.json();
      if (!res.ok) { el('authError').textContent = data.error || '登录失败'; return; }
      currentUser = data;
      el('authModal').classList.remove('show');
      applyAuthBar();
      renderForm();
    }

    async function doRegister() {
      var role = getRegRole();
      var name = el('regName').value.trim();
      var password = el('regPass').value;
      var password2 = el('regPass2').value;
      var phone = el('regPhone').value.trim();
      var grade = el('regGrade').value;
      var class_name = el('regClass').value;

      if (!name) { el('authError').textContent = '请填写姓名'; return; }
      if (!password) { el('authError').textContent = '请设置密码'; return; }
      if (password.length < 4) { el('authError').textContent = '密码至少4位'; return; }
      if (password !== password2) { el('authError').textContent = '两次密码输入不一致'; return; }
      if (_regNameLastOk !== name) {
        el('authError').textContent = '请确认姓名可用（或姓名已被占用）'; return;
      }
      if (role === 'parent' && !phone) { el('authError').textContent = '访客请填写手机号'; return; }
      if (role === 'parent' && phone && !/^1[3-9]\d{9}$/.test(phone)) { el('authError').textContent = '手机号格式不正确'; return; }
      if (role === 'teacher' && (!grade || !class_name)) { el('authError').textContent = '老师请填写班级'; return; }

      var res = await fetch('/api/auth/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: name, password: password, role: role, name: name, phone: phone, grade: grade, class_name: class_name })
      });
      var data = await res.json();
      if (!res.ok) { el('authError').textContent = data.error || '注册失败'; return; }
      currentUser = data;
      el('authModal').classList.remove('show');
      applyAuthBar();
      if (role === 'teacher') { teachers = await (await fetch('/api/teachers')).json(); }
      renderForm();
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      currentUser = null;
      applyAuthBar();
      renderForm();
    }

    // ===== 我的资料 =====
    function openProfile() {
      el('profileName').value = currentUser.name || '';
      el('profilePhone').value = currentUser.phone || '';
      el('profilePhotoPreview').src = currentUser.photo_path || '';
      el('profilePhotoPreview').classList.toggle('show', !!currentUser.photo_path);
      var isParent = currentUser.role === 'parent';
      var isTeacher = currentUser.role === 'teacher';
      el('profileParentFields').style.display = isParent ? 'block' : 'none';
      el('profileTeacherFields').style.display = isTeacher ? 'block' : 'none';
      if (isTeacher) {
        el('profileGrade').value = currentUser.grade || '';
        var sel = el('profileClass');
        sel.innerHTML = '';
        if (currentUser.grade) {
          var n = schoolClasses.classesPerGrade || 4;
          for (var i = 1; i <= n; i++) {
            var v = currentUser.grade + '（' + i + '）班';
            sel.innerHTML += '<option value="' + v + '"' + (v === currentUser.class_name ? ' selected' : '') + '>' + v + '</option>';
          }
        }
      }
      el('profileModal').classList.add('show');
    }
    function closeProfile() { el('profileModal').classList.remove('show'); }
    function fillProfileClass() {
      var g = el('profileGrade').value;
      var sel = el('profileClass');
      sel.innerHTML = '<option value="">选择班级</option>';
      if (!g) return;
      var n = schoolClasses.classesPerGrade || 4;
      for (var i = 1; i <= n; i++) sel.innerHTML += '<option value="' + g + '（' + i + '）班">' + g + '（' + i + '）班</option>';
    }

    async function uploadProfilePhoto(input) {
      var file = input.files[0];
      if (!file) return;
      var fd = new FormData();
      fd.append('photo', file);
      var res = await fetch('/upload', { method: 'POST', body: fd });
      var data = await res.json();
      if (!res.ok) { alert(data.error || '上传失败'); return; }
      currentUser.photo_path = data.photoPath;
      el('profilePhotoPreview').src = data.photoPath;
      el('profilePhotoPreview').classList.add('show');
    }

    async function saveProfile() {
      var name = el('profileName').value.trim();
      var phone = el('profilePhone').value.trim();
      var grade = el('profileGrade').value;
      var class_name = el('profileClass').value;
      var body = { name: name, phone: phone, photoPath: currentUser.photo_path };
      if (currentUser.role === 'teacher') { body.grade = grade; body.class_name = class_name; }
      var res = await fetch('/api/auth/profile', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      var data = await res.json();
      if (!res.ok) { alert(data.error || '保存失败'); return; }
      currentUser = data;
      el('profileModal').classList.remove('show');
      if (currentUser.role === 'teacher') { teachers = await (await fetch('/api/teachers')).json(); }
      applyAuthBar();
      renderForm();
    }

    // ===== 提交登记 =====
    el('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var form = el('form');
      el('message').className = 'message';
      el('message').style.display = 'none';

      var formData = new FormData(form);
      var identityRadio = form.querySelector('input[name="identity"]:checked');
      var identity = identityRadio ? identityRadio.value : (isParent() ? '家长' : currentIdentity);
      var name, phone, photoPathFinal;
      if (isParent()) {
        name = currentUser.name;
        phone = currentUser.phone;
        photoPathFinal = currentUser.photo_path;
      } else {
        name = formData.get('name') || '';
        phone = formData.get('phone') || '';
        photoPathFinal = photoPath;
      }
      var host = formData.get('host') || '';
      var classInfo = formData.get('classInfo') || '';
      var purposeChecked = form.querySelector('input[name="purpose"]:checked');
      var purposeValue = purposeChecked ? purposeChecked.value : '';
      var purposeDetail = formData.get('purposeDetail');
      var company = formData.get('company');
      var fromSchool = formData.get('fromSchool');
      var reason = formData.get('reason');
      var photoInput = form.querySelector('input[name="photo"]');

      if (!name) { showMessage('请填写姓名', 'error'); return; }
      if (!phone) { showMessage('请填写手机号', 'error'); return; }
      var phoneRegex = /^1[3-9]\d{9}$/;
      if (!phoneRegex.test(phone)) { showMessage('手机号格式不正确', 'error'); return; }
      if (!isParent() && fieldEnabled('photo') && fieldRequired('photo') && photoInput && !photoInput.files[0] && !photoPath) {
        showMessage('请上传人脸照片', 'error'); return;
      }

      if (identity === '家长') {
        if (purposeValue === '接送' || purposeValue === '沟通' || purposeValue === '家长会' || purposeValue === '陪餐') {
          if (!classInfo) { showMessage('请选择班级', 'error'); return; }
        }
      } else if (identity === '维修工') {
        if (!company || !reason) { showMessage('请填写公司名称和维修内容', 'error'); return; }
      } else if (identity === '外来老师') {
        if (!fromSchool) { showMessage('请填写来访人单位', 'error'); return; }
        if (!purposeValue) { showMessage('请选择来校事由', 'error'); return; }
      } else if (identity === '其他') {
        if (!purposeDetail) { showMessage('请填写来校事由', 'error'); return; }
      }

      var customFields = {};
      var cfList = config.customFields || [];
      for (var ci = 0; ci < cfList.length; ci++) {
        var cf = cfList[ci];
        var cval = formData.get('custom_' + cf.id);
        if (cf.required && !cval) { showMessage('请填写' + cf.label, 'error'); return; }
        customFields[cf.label] = cval || '';
      }

      var submitBtn = el('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      try {
        if (!isParent() && photoInput && photoInput.files[0]) {
          var pf = new FormData();
          pf.append('photo', photoInput.files[0]);
          var up = await fetch('/upload', { method: 'POST', body: pf });
          if (!up.ok) throw new Error('照片上传失败');
          photoPathFinal = (await up.json()).photoPath;
        }

        var res = await fetch('/api/visitors', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name, phone: phone, identity: identity, photoPath: photoPathFinal,
            purpose: purposeValue, purposeDetail: purposeDetail,
            host: host, classInfo: classInfo, company: company, fromSchool: fromSchool, reason: reason,
            customFields: customFields
          })
        });

        if (!res.ok) {
          var err = await res.json();
          throw new Error(err.error || '提交失败');
        }

        var result = await res.json();
        showMessage('登记成功！访客码：' + result.code, 'success');
        photoPath = null;
        submitBtn.disabled = false;
        submitBtn.textContent = '提交登记';
        renderForm();
      } catch (err) {
        showMessage(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = '提交登记';
      }
    });

    init();
  </script>
</body>
</html>

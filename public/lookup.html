<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客码查询</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #f1f5f9;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      padding: 30px 24px;
      text-align: center;
    }
    .header h1 { font-size: 24px; font-weight: 600; }
    .header p { font-size: 14px; opacity: 0.85; margin-top: 4px; }
    
    .search-box {
      padding: 24px;
      border-bottom: 1px solid #e5e7eb;
    }
    .search-box input {
      width: 100%;
      padding: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
    }
    .search-box input::placeholder {
      letter-spacing: normal;
      text-transform: none;
    }
    .search-hint {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 10px;
    }
    
    .result {
      padding: 24px;
      display: none;
    }
    .result.show { display: block; }
    .result-card {
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
    }
    .result-card.success {
      border: 2px solid var(--success);
      background: #f0fdf4;
    }
    .result-card.error {
      border: 2px solid var(--danger);
      background: #fef2f2;
    }
    .result-card h3 {
      font-size: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-card.success h3 { color: #166534; }
    .result-card.error h3 { color: #991b1b; }
    .info-row {
      display: flex;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { width: 90px; color: #6b7280; font-size: 14px; }
    .info-value { flex: 1; color: #1f2937; font-size: 14px; font-weight: 500; }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-badge.in { background: #dcfce7; color: #166534; }
    .status-badge.out { background: #f3f4f6; color: #6b7280; }
    
    .links {
      text-align: center;
      padding: 20px;
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .links a {
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      padding: 10px 20px;
    }
    .links a:hover { background: #f8fafc; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="login-overlay" id="loginOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:9999;">
    <div style="background:white;padding:40px;border-radius:16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
      <h2 style="margin-bottom:20px;">请输入密码</h2>
      <input type="password" id="password" placeholder="请输入管理密码" style="padding:12px;border:2px solid #e1e5ee;border-radius:8px;width:200px;text-align:center;font-size:16px;">
      <br><br>
      <button onclick="checkPassword()" style="padding:12px 30px;background:#3b82f6;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;">确认</button>
      <p id="loginError" style="color:#ef4444;margin-top:10px;display:none;">密码错误</p>
    </div>
  </div>
  
  <div class="main-content" id="mainContent" style="display:none;">
  <div class="container">
    <div class="header">
      <h1>访客码查询</h1>
      <p>输入6位访客码查询访客信息</p>
    </div>
    
    <div class="search-box">
      <input type="text" id="codeInput" maxlength="6" placeholder="请输入访客码" oninput="this.value = this.value.toUpperCase()">
      <p class="search-hint">* 不区分大小写</p>
    </div>
    
    <div class="result" id="result">
      <div class="result-card" id="resultCard">
        <h3 id="resultTitle"></h3>
        <div id="resultContent"></div>
      </div>
    </div>
    
    <div class="links">
      <a href="/index.html">访客登记</a>
      <a href="/records.html">管理后台</a>
    </div>
  </div>

  <script>
    function checkPassword() {
      if (document.getElementById('password').value === '1234') {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }
    
    document.getElementById('password').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
    
    var codeInput = document.getElementById('codeInput');
    
    codeInput.addEventListener('keyup', function(e) {
      if (e.key === 'Enter' || this.value.length === 6) {
        searchCode(this.value.toUpperCase());
      }
    });
    
    async function searchCode(code) {
      if (code.length < 6) return;
      
      var result = document.getElementById('result');
      var resultCard = document.getElementById('resultCard');
      var resultTitle = document.getElementById('resultTitle');
      var resultContent = document.getElementById('resultContent');
      
      result.style.display = 'block';
      
      try {
        var res = await fetch('/api/visitors?code=' + code);
        var data = await res.json();
        
        if (data.total > 0) {
          var v = data.data[0];
          var isIn = !v.checkout_at;
          var statusBadge = isIn 
            ? '<span class="status-badge in">在访中</span>' 
            : '<span class="status-badge out">已签离</span>';
          
          resultCard.className = 'result-card success';
          resultTitle.innerHTML = '<i class="bi bi-check-circle"></i> 访客信息 ' + statusBadge;
          
          var hostInfo = '';
          if (v.identity === '家长') {
            if (v.purpose === '家长会' && v.class_info) {
              hostInfo = v.class_info;
            } else if ((v.purpose === '探访' || v.purpose === '送东西') && v.class_info && v.student_info) {
              hostInfo = v.class_info + ' ' + v.student_info;
            } else {
              hostInfo = v.class_info || '-';
            }
          } else if (v.identity === '维修工') {
            hostInfo = v.company || '-';
          } else if (v.identity === '外来老师') {
            hostInfo = v.from_school || '-';
          } else {
            hostInfo = v.host || '-';
          }
          
          var purposeInfo = v.purpose || '-';
          if (v.purpose_detail) purposeInfo += '：' + v.purpose_detail;
          
          resultContent.innerHTML = 
            '<div class="info-row"><div class="info-label">访客码</div><div class="info-value" style="color:#3b82f6;font-size:16px;">' + v.code + '</div></div>' +
            '<div class="info-row"><div class="info-label">姓名</div><div class="info-value">' + v.name + '</div></div>' +
            '<div class="info-row"><div class="info-label">手机号</div><div class="info-value">' + v.phone + '</div></div>' +
            '<div class="info-row"><div class="info-label">身份</div><div class="info-value">' + (v.identity || '访客') + '</div></div>' +
            '<div class="info-row"><div class="info-label">' + (v.identity === '维修工' || v.identity === '外来老师' ? '单位' : '被访') + '</div><div class="info-value">' + hostInfo + '</div></div>' +
            '<div class="info-row"><div class="info-label">来校事由</div><div class="info-value">' + purposeInfo + '</div></div>' +
            '<div class="info-row"><div class="info-label">签到时间</div><div class="info-value">' + v.checkin_at + '</div></div>' +
            (v.checkout_at ? '<div class="info-row"><div class="info-label">签离时间</div><div class="info-value">' + v.checkout_at + '</div></div>' : '');
        } else {
          resultCard.className = 'result-card error';
          resultTitle.innerHTML = '<i class="bi bi-x-circle"></i> 未找到该访客码';
          resultContent.innerHTML = '<p style="color:#991b1b;">访客码 ' + code + ' 不存在，请检查后重新输入</p>';
        }
      } catch(e) {
        resultCard.className = 'result-card error';
        resultTitle.innerHTML = '<i class="bi bi-x-circle"></i> 查询失败';
        resultContent.innerHTML = '<p style="color:#991b1b;">网络错误，请稍后重试</p>';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客码查询</title>
  <link rel="stylesheet" href="/css/lookup.css">
</head>
<body>
  <div class="login-overlay" id="loginOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:9999;">
    <div style="background:white;padding:40px;border-radius:16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
      <h2 style="margin-bottom:20px;">请输入管理密码</h2>
      <input type="password" id="password" placeholder="请输入密码" style="padding:12px;border:2px solid #e1e5ee;border-radius:8px;width:200px;text-align:center;font-size:16px;">
      <br><br>
      <button onclick="checkPassword()" style="padding:12px 30px;background:var(--primary);color:var(--on-primary);border:none;border-radius:8px;font-size:16px;cursor:pointer;">确认</button>
      <p id="loginError" style="color:#ef4444;margin-top:10px;display:none;">密码错误</p>
      <br>
      <a href="/index.html" style="color:var(--primary-deep);font-size:13px;text-decoration:none;">← 返回登记页</a>
    </div>
  </div>
  
  <div class="main-content" id="mainContent" style="display:none;">
  <div class="container">
    <div class="header">
      <img id="headerLogo" class="header-logo" src="/uploads/logo.png" alt="logo">
      <h1 id="schoolName">访客码查询</h1>
      <p>输入6位访客码查询访客信息</p>
    </div>
    
    <div class="search-box">
      <input type="text" id="codeInput" maxlength="6" placeholder="请输入访客码" oninput="this.value = this.value.toUpperCase()">
      <p class="search-hint">* 不区分大小写</p>
    </div>
    
    <div class="result" id="result">
      <div class="result-card" id="resultCard">
        <h3 id="resultTitle"></h3>
        <div id="resultContent"></div>
      </div>
    </div>
    
    <div class="links">
      <a href="/index.html">返回登记页</a>
      <a href="/records.html">管理后台</a>
    </div>
  </div>

  <script>
    function textColorFor(hex) {
      var h = (hex || '').replace('#', '');
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      if (h.length !== 6) return '#ffffff';
      var r = parseInt(h.substr(0, 2), 16);
      var g = parseInt(h.substr(2, 2), 16);
      var b = parseInt(h.substr(4, 2), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#111827' : '#ffffff';
    }

    async function applyConfig() {
      try {
        var res = await fetch('/api/config');
        var cfg = await res.json();
        var s = document.documentElement.style;
        s.setProperty('--primary', cfg.theme.primary);
        s.setProperty('--secondary', cfg.theme.secondary);
        s.setProperty('--on-primary', textColorFor(cfg.theme.primary));
        document.getElementById('schoolName').textContent = cfg.schoolName || '访客码查询';
        if (cfg.logoPath) document.getElementById('headerLogo').src = cfg.logoPath;
      } catch(e) {}
    }

    function checkPassword() {
      if (document.getElementById('password').value === '1234') {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }
    
    document.getElementById('password').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
    
    var codeInput = document.getElementById('codeInput');
    
    codeInput.addEventListener('keyup', function(e) {
      if (e.key === 'Enter' || this.value.length === 6) {
        searchCode(this.value.toUpperCase());
      }
    });
    
    async function searchCode(code) {
      if (code.length < 6) return;
      
      var result = document.getElementById('result');
      var resultCard = document.getElementById('resultCard');
      var resultTitle = document.getElementById('resultTitle');
      var resultContent = document.getElementById('resultContent');
      
      result.style.display = 'block';
      
      try {
        var res = await fetch('/api/visitors?code=' + code);
        var data = await res.json();
        
        if (data.total > 0) {
          var v = data.data[0];
          var isIn = !v.checkout_at;
          var statusBadge = isIn 
            ? '<span class="status-badge in">在访中</span>' 
            : '<span class="status-badge out">已签离</span>';
          
          resultCard.className = 'result-card success';
          resultTitle.innerHTML = '<i class="bi bi-check-circle"></i> 访客信息 ' + statusBadge;
          
          var hostInfo = '';
          if (v.identity === '家长') {
            hostInfo = v.host || v.class_info || '-';
          } else if (v.identity === '维修工') {
            hostInfo = v.company || '-';
          } else if (v.identity === '外来老师') {
            hostInfo = v.from_school || '-';
          } else {
            hostInfo = v.purpose_detail || v.host || '-';
          }
          
          var purposeInfo = v.purpose || '-';
          if (v.purpose_detail) purposeInfo += '：' + v.purpose_detail;
          
          resultContent.innerHTML = 
            '<div class="info-row"><div class="info-label">访客码</div><div class="info-value" style="color:var(--primary);font-size:16px;">' + v.code + '</div></div>' +
            '<div class="info-row"><div class="info-label">姓名</div><div class="info-value">' + v.name + '</div></div>' +
            '<div class="info-row"><div class="info-label">手机号</div><div class="info-value">' + v.phone + '</div></div>' +
            '<div class="info-row"><div class="info-label">身份</div><div class="info-value">' + (v.identity || '访客') + '</div></div>' +
            '<div class="info-row"><div class="info-label">' + (v.identity === '维修工' || v.identity === '外来老师' || v.identity === '其他' ? '单位' : '被访') + '</div><div class="info-value">' + hostInfo + '</div></div>' +
            '<div class="info-row"><div class="info-label">来校事由</div><div class="info-value">' + purposeInfo + '</div></div>' +
            '<div class="info-row"><div class="info-label">签到时间</div><div class="info-value">' + v.checkin_at + '</div></div>' +
            (v.checkout_at ? '<div class="info-row"><div class="info-label">签离时间</div><div class="info-value">' + v.checkout_at + '</div></div>' : '');
        } else {
          resultCard.className = 'result-card error';
          resultTitle.innerHTML = '<i class="bi bi-x-circle"></i> 未找到该访客码';
          resultContent.innerHTML = '<p style="color:#991b1b;">访客码 ' + code + ' 不存在，请检查后重新输入</p>';
        }
      } catch(e) {
        resultCard.className = 'result-card error';
        resultTitle.innerHTML = '<i class="bi bi-x-circle"></i> 查询失败';
        resultContent.innerHTML = '<p style="color:#991b1b;">网络错误，请稍后重试</p>';
      }
    }
    
    applyConfig();
  </script>
</body>
</html>
